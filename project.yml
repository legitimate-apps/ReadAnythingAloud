name: ReadAnythingAloud
options:
  bundleIdPrefix: com.legitimateapps
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 3LTL47SJ8C
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  ReadAloudKit:
    path: Packages/ReadAloudKit
targets:
  ReadAnythingAloud:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: ReadAloudKit
        product: ReadAloudKit
      - target: ShareExtension
        destinationFilters: [iOS]
    entitlements:
      path: App/Support/ReadAnythingAloud.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: ReadAnythingAloud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        LSApplicationCategoryType: public.app-category.productivity
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: com.legitimateapps.ReadAnythingAloud
            CFBundleURLSchemes: [readanythingaloud]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web Location
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.web-internet-location, public.url]
          - CFBundleTypeName: Web Page
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.ReadAnythingAloud
        PRODUCT_NAME: ReadAnythingAloud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/Support/ReadAnythingAloud-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Support/ReadAnythingAloud-iOS.entitlements
        # The script below deletes a bundle path, which the user-script sandbox doesn't permit.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Remove unused ONNX Runtime stub
        basedOnDependencyAnalysis: false
        script: |
          # onnxruntime ships as a static xcframework and is linked into the app binary, but Xcode still embeds
          # an empty stub onnxruntime.framework. Nothing loads it, and App Store validation rejects its
          # Info.plist (ITMS-90208), so drop it before the app is signed.
          rm -rf "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/onnxruntime.framework"
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.legitimateapps.ReadAnythingAloud]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ReadAnythingAloud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: Preprocess
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.ReadAnythingAloud.Share
        PRODUCT_NAME: ReadAnythingAloudShare
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
